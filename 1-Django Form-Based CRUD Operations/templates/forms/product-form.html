<form method="post">
  {% csrf_token %}
  <p>
    <label for="product-name">Product name:</label><br />
    <input type="text" id="product-name" name="product-name" value="{{ prod.name }}" /><br />
  </p>
  <p>
    <label for="product-quantity">Quantity: </label><br />
    <input type="number" id="product-quantity" name="product-quantity" value="{{ prod.quantity }}" /><br />
  </p>
  <p>
    <label for="product-price">Price: </label><br />
    <input type="number" id="product-price" name="product-price" value="{{ prod.price }}" /><br />
  </p>
  <input type="submit" value="Submit" />
</form>

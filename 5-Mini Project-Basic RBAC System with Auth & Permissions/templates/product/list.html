<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>
    <h1>Products List</h1>

    <table>
        <tr>
            <th>#</th>
            <th>Product</th>
            <th>Price</th>
        </tr>
        {% for prod in products %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ prod.name }}</td>
            <td>{{ prod.price }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
